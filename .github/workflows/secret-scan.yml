name: Secret Scan

# TASK 13P: independent, additive secret-scanning workflow, kept separate from
# .github/workflows/test.yml deliberately -- that file is scoped tightly to
# test/typecheck and this adds an unrelated concern with its own blast radius.
#
# Pinned to gitleaks/gitleaks-action@v3 (commit e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e,
# tag v3.0.0) -- not v2: GitHub removed the Node 20 runtime v2 depends on from
# GitHub-hosted runners on 2026-09-16, a date already past. v3 is confirmed
# behavior-identical to v2.3.9 by the vendor's own release notes, just on Node 24.
# See BELL24H_OS_TASK13O_SECRET_SCANNING_IMPLEMENTATION_READINESS.md Section 5 for
# the full source-verified rationale behind every choice in this file.
#
# This repository is owned by a personal GitHub account ("User", not an
# "Organization"), confirmed via the GitHub API -- gitleaks-action's own source
# (src/index.js) only enforces its GITLEAKS_LICENSE requirement for
# Organization-owned repos, so no license secret is needed or added here.
#
# GITLEAKS_ENABLE_COMMENTS is explicitly set to "false" so this workflow only
# needs contents: read -- the PR-inline-comment feature would otherwise require
# pull-requests: write to call the GitHub API. The job summary and the SARIF
# artifact already report any finding either way.
#
# SARIF is uploaded only as a same-run GitHub Actions artifact (gitleaks-action's
# own default behavior), never to the Security tab / code-scanning API -- the
# vendor's own README explicitly advises against that integration pattern, and
# it would need security-events: write, which this workflow deliberately omits.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history required: gitleaks-action's own commit-range scan
          # (push and pull_request alike) needs to resolve baseRef^, which a
          # shallow checkout would not have locally.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
