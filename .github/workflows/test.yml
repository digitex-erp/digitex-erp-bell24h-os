name: Test

# Confirmed via `gh pr checks` (independent review of PR #15, 2026-10-26) that
# no existing check on this repository runs `npm test` or a TypeScript
# check -- the three checks that currently gate every PR (GitGuardian,
# Vercel build, Vercel Preview Comments) are GitHub-App-based and do not
# execute this repo's test suite. This workflow is the first one added to
# .github/workflows in this repository -- there is no prior workflow to
# conflict with or duplicate.
#
# Type-check is scoped to server/ (via server/tsconfig.json), not the whole
# repo: a repo-wide `npx tsc --noEmit` run in this exact CI environment (a
# fresh `npm ci`, not a locally-cached node_modules) surfaced 266
# pre-existing errors, entirely in the unrelated src/ frontend tree (e.g.
# src/App.tsx "Cannot find namespace 'React'", several pages' CVA/Radix
# `variant` prop typing) -- none in server/, none touched by any PR this
# workflow was added for. Blocking every future PR on unrelated,
# already-broken frontend types would make this check noise, not signal.
# Fixing that pre-existing debt is a separate, untracked piece of work, out
# of scope here.

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check (server/)
        run: npx tsc --noEmit -p server/tsconfig.json
        if: always()
