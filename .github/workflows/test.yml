name: Tests and Type Check

# Closes a real gap found in independent review: this repository had NO
# .github/workflows directory at all, so no pull request has ever had its
# test suite executed by CI. The three checks that do run on PRs
# (GitGuardian, Vercel build, Vercel Preview Comments) never invoke
# `npm test` or `tsc`. Every "N/N passing" figure in this repository's PR
# descriptions to date is a locally-run result, not a CI-verified one.
#
# This workflow is additive and is the only workflow in the repository --
# there is nothing to duplicate or conflict with (verified: the directory
# did not exist before this change).

on:
  pull_request:
    branches:
      - main
      - feature/communication-hub
  push:
    branches:
      - main
      - feature/communication-hub

# Cancel an in-progress run when the same branch/PR is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test + tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Node version the Vercel project reports (24.x).
          node-version: '24'
          cache: 'npm'

      # `npm ci` requires a lockfile and installs exactly what it pins. If the
      # lockfile is absent or out of sync this step fails loudly rather than
      # silently resolving different versions than local runs used.
      - name: Install dependencies
        run: npm ci

      # Type check. `tsc --noEmit` exits non-zero on any type error, which
      # fails the job.
      - name: Type check
        run: npm run lint

      # The actual test suite. `npm test` exits non-zero when any test fails
      # (node:test's own behavior), which fails the job. This is the check
      # that was previously missing entirely.
      - name: Tests
        run: npm test

      # Catches trailing whitespace / conflict markers introduced by a PR.
      # Compared against the merge base so only this PR's own changes count.
      - name: Whitespace and conflict-marker check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git diff --check "origin/${{ github.base_ref }}"...HEAD
